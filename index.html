<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DOYUNGO MAPS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
<style>
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column}
#map{flex:1;min-height:0}
.tools{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.tools input{flex:1;min-width:150px}
</style>
</head><body>
<header class="bar"><b>DOYUNGO MAPS</b><a href="docs.html">개발자 문서</a><a href="admin.html">관리자</a></header>
<div class="tools">
  <select id="style">
    <option value="streets">일반 지도</option>
    <option value="satellite">위성 지도</option>
    <option value="terrain">지형 지도</option>
    <option value="topo">등고선 지도</option>
  </select>
  <input id="key" type="password" placeholder="발급받은 API 키" autocomplete="off">
  <button id="saveKey">키 저장</button>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map("map").setView([36.6424, 127.489], 11); // 청주
const keyEl = document.getElementById("key"), styleEl = document.getElementById("style");
let layer;
const get = k => { try { return localStorage.getItem(k) || "" } catch { return "" } };
const set = (k, v) => { try { localStorage.setItem(k, v) } catch {} };

function load() {
  if (layer) map.removeLayer(layer);
  const s = styleEl.value, ext = s === "satellite" ? "jpg" : "png", k = get("savedKey");
  layer = L.tileLayer(`/api/tiles/${s}/{z}/{x}/{y}.${ext}${k ? "?key=" + encodeURIComponent(k) : ""}`,
    { maxZoom: 19, attribution: '&copy; <a href="https://www.maptiler.com/copyright/">MapTiler</a> &copy; OpenStreetMap' }).addTo(map);
}
keyEl.value = get("savedKey");
styleEl.onchange = load;
document.getElementById("saveKey").onclick = () => { set("savedKey", keyEl.value.trim()); load(); };
load();
</script>
</body></html>
